<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="About · Pedro Silva">
  <defs>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9B6F2"/>
      <stop offset="50%" stop-color="#3B2A63"/>
      <stop offset="100%" stop-color="#8E7CC3"/>
    </linearGradient>
    <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: 'Fira Code','JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace; font-size: 17px; }
      .p { fill: #8E7CC3; } .c { fill: #E6E0F5; } .o { fill: #C9B6F2; } .d { fill: #6E6488; }
      .jp { font-family: 'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif; fill: #3B2A63; font-weight: 700; }
      .l { opacity: 0; animation: surge 14s ease-out infinite; }
      @keyframes surge { 0% { opacity: 0; transform: translateX(-6px) } 3% { opacity: 1; transform: none } 92% { opacity: 1 } 100% { opacity: 0 } }
      .l1 { animation-delay: .2s } .l2 { animation-delay: .9s } .l3 { animation-delay: 1.8s } .l4 { animation-delay: 2.5s }
      .l5 { animation-delay: 3.4s } .l6 { animation-delay: 4.1s } .l7 { animation-delay: 5.0s } .l8 { animation-delay: 5.7s }
      .cur { animation: piscar 1s steps(1) infinite; fill: #C9B6F2; }
      @keyframes piscar { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1 } .cur { animation: none } }
    </style>
  </defs>

  <rect x="6" y="6" width="888" height="288" rx="14" fill="#0B0B0F" stroke="url(#borda)" stroke-width="2" filter="url(#brilho)"/>
  <rect x="6" y="6" width="888" height="288" rx="14" fill="#0B0B0F" stroke="url(#borda)" stroke-width="1.5"/>

  <!-- barra da janela -->
  <circle cx="34" cy="32" r="6" fill="#3B2A63"/>
  <circle cx="54" cy="32" r="6" fill="#8E7CC3"/>
  <circle cx="74" cy="32" r="6" fill="#C9B6F2"/>
  <text x="450" y="37" text-anchor="middle" class="t d" font-size="14">pain@rinnegan: ~</text>
  <line x1="6" y1="52" x2="894" y2="52" stroke="#1A1230" stroke-width="1.5"/>

  <!-- kanji de fundo -->
  <text x="868" y="270" text-anchor="end" class="jp" font-size="120" opacity="0.45">痛</text>

  <g class="t">
    <text class="l l1" x="30" y="86"><tspan class="p">❯ </tspan><tspan class="c">whoami</tspan></text>
    <text class="l l2" x="30" y="110"><tspan class="o">Pedro Silva · 23 · Portugal</tspan></text>
    <text class="l l3" x="30" y="142"><tspan class="p">❯ </tspan><tspan class="c">cat role.txt</tspan></text>
    <text class="l l4" x="30" y="166"><tspan class="o">Full-stack developer @ Doutor Energia · freelance @ POP TVDE</tspan></text>
    <text class="l l5" x="30" y="198"><tspan class="p">❯ </tspan><tspan class="c">ls ./skills</tspan></text>
    <text class="l l6" x="30" y="222"><tspan class="o">backends · real-time systems · automations · integrations · AI</tspan></text>
    <text class="l l7" x="30" y="254"><tspan class="p">❯ </tspan><tspan class="c">cat next.txt</tspan></text>
    <text class="l l8" x="30" y="278"><tspan class="o">LogDriver — coming soon · off-code: ♟ chess</tspan><tspan class="cur"> ▍</tspan></text>
  </g>
</svg>
