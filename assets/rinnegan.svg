<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Rinnegan animado · Pedro Silva">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9DEFF"/>
      <stop offset="55%" stop-color="#C9B6F2"/>
      <stop offset="100%" stop-color="#8E7CC3"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B6F2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9B6F2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .jp { font-family: 'Noto Sans JP','Yu Gothic','Hiragino Sans',sans-serif; fill: #C9B6F2; }
      .mono { font-family: 'Fira Code','Consolas',monospace; fill: #E6E0F5; }
      .ring { fill: none; stroke: #1A1230; }
      .onda { fill: none; stroke: #C9B6F2; }
      @keyframes acender { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .k1 { animation: acender 3.2s ease-in-out infinite; }
      .k2 { animation: acender 3.2s ease-in-out .4s infinite; }
      .k3 { animation: acender 3.2s ease-in-out .8s infinite; }
      .k4 { animation: acender 3.2s ease-in-out 1.2s infinite; }
      @media (prefers-reduced-motion: reduce) { .k1,.k2,.k3,.k4 { animation: none; opacity: 1 } }
    </style>
  </defs>

  <rect width="900" height="320" rx="14" fill="#0B0B0F"/>

  <!-- 神羅天征: ondas de choque a sair do olho -->
  <g transform="translate(450 160)">
    <circle class="onda" r="96" stroke-width="2" opacity="0">
      <animate attributeName="r" values="96;440" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle class="onda" r="96" stroke-width="2" opacity="0">
      <animate attributeName="r" values="96;440" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3;0.5" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="onda" r="96" stroke-width="2" opacity="0">
      <animate attributeName="r" values="96;440" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3;0.5" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- aura -->
    <circle r="130" fill="url(#aura)">
      <animate attributeName="r" values="118;138;118" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- 輪廻眼: íris com anéis concêntricos -->
    <g filter="url(#glow)">
      <circle r="92" fill="url(#iris)" stroke="#0B0B0F" stroke-width="3"/>
      <circle class="ring" r="76" stroke-width="2.6">
        <animate attributeName="stroke-width" values="2.6;3.6;2.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle class="ring" r="60" stroke-width="2.6">
        <animate attributeName="stroke-width" values="2.6;3.6;2.6" dur="3.2s" begin=".25s" repeatCount="indefinite"/>
      </circle>
      <circle class="ring" r="44" stroke-width="2.6">
        <animate attributeName="stroke-width" values="2.6;3.6;2.6" dur="3.2s" begin=".5s" repeatCount="indefinite"/>
      </circle>
      <circle class="ring" r="28" stroke-width="2.6">
        <animate attributeName="stroke-width" values="2.6;3.6;2.6" dur="3.2s" begin=".75s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="#0B0B0F">
        <animate attributeName="r" values="9;6;9" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <!-- brilho a rodar -->
      <g>
        <ellipse cx="-34" cy="-40" rx="16" ry="7" fill="#FFFFFF" opacity="0.35" transform="rotate(-35 -34 -40)"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- 痛 · 六道 · 天道 · 輪廻 -->
  <text class="jp k1" x="70"  y="120" font-size="54" font-weight="700">痛</text>
  <text class="jp k2" x="70"  y="230" font-size="54" font-weight="700">六道</text>
  <text class="jp k3" x="760" y="120" font-size="54" font-weight="700">天道</text>
  <text class="jp k4" x="760" y="230" font-size="54" font-weight="700">輪廻</text>

  <text class="mono" x="450" y="300" font-size="15" text-anchor="middle" opacity="0.85">神羅天征 · Pedro Silva · full-stack</text>
</svg>
